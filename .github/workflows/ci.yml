name: ci

# The single entry point of the ERP's checks (docs/engineering/staging-e-promocao.md).
#   ci-gate      required to merge a pull request into master.
#   master-gate  exists only on a commit that reached master and passed everything; required to move `production`.
on:
  push:
    branches: [master]
  pull_request:

# A pull request's new push replaces its older run. A commit on master is never cancelled or replaced by a later one:
# its group is its own SHA, so every commit keeps a complete verdict.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Pull requests run what their diff touches (the checkout is the merge commit, so HEAD^1 is the base). Master always
      # runs everything: a commit that only touches docs must not earn a green verdict over a broken commit before it.
      - name: What changed?
        id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          if echo "$files" | grep -qE '^(nexo-backend/|\.github/workflows/)'; then echo "backend=true" >> "$GITHUB_OUTPUT"; else echo "backend=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$files" | grep -qE '^(nexo-main/|\.github/workflows/)'; then echo "frontend=true" >> "$GITHUB_OUTPUT"; else echo "frontend=false" >> "$GITHUB_OUTPUT"; fi

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-tests.yml

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-ci.yml

  sonarcloud:
    uses: ./.github/workflows/sonarcloud.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Always reports, so a required check never hangs on a job that the diff skipped. A skipped job counts only when the
  # diff did not touch it; anything failed or cancelled fails the gate.
  ci-gate:
    if: always()
    needs: [changes, backend, frontend, sonarcloud]
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          SONAR: ${{ needs.sonarcloud.result }}
        run: |
          echo "changes=$CHANGES backend=$BACKEND frontend=$FRONTEND sonarcloud=$SONAR"
          [ "$CHANGES" = "success" ] && [ "$SONAR" = "success" ] || exit 1
          case "$BACKEND" in success|skipped) ;; *) exit 1 ;; esac
          case "$FRONTEND" in success|skipped) ;; *) exit 1 ;; esac

  # The only proof a promotion accepts: this exact commit is on master and everything ran and passed, nothing skipped.
  # Pull request runs do not produce it, so the head of an unmerged branch cannot reach production.
  master-gate:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [changes, backend, frontend, sonarcloud]
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          SONAR: ${{ needs.sonarcloud.result }}
        run: |
          echo "changes=$CHANGES backend=$BACKEND frontend=$FRONTEND sonarcloud=$SONAR"
          [ "$CHANGES" = "success" ] && [ "$BACKEND" = "success" ] && [ "$FRONTEND" = "success" ] && [ "$SONAR" = "success" ]
