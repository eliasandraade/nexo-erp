name: frontend-ci

# Frontend gate: install from the committed lockfile, typecheck, lint, unit tests, production build
# and the critical Playwright suite (API mocked, no backend needed).
on:
  push:
    branches: [master]
    paths:
      - "nexo-main/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "nexo-main/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nexo-main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nexo-main/package-lock.json

      # --ignore-scripts: no dependency runs install scripts on the runner (native binaries come
      # as optional platform packages from the lockfile; nothing here needs a postinstall).
      - name: Install (lockfile)
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Same Vitest run, with coverage: lcov for SonarCloud and a text summary in the log.
      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: nexo-main/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: npm run build

      # The production server: this Caddyfile on caddy:2-alpine (as in the Dockerfile) over the build above, checked by
      # Host header (docs/engineering/public-hosts.md).
      - name: Public hosts (production server)
        run: |
          docker run -d --name caddy -p 8099:8080 -e PORT=8080 \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/dist:/srv:ro" caddy:2-alpine
          trap 'docker logs caddy 2>&1 | tail -n 20; docker rm -f caddy >/dev/null' EXIT
          for i in $(seq 1 30); do curl -fs -o /dev/null http://localhost:8099/ && break; sleep 1; done
          bash scripts/check-public-hosts.sh http://localhost:8099

      - name: Playwright browsers
        run: npm run e2e:install

      - name: Critical end-to-end suite
        run: npm run e2e:critical

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: nexo-main/playwright-report
          retention-days: 7
