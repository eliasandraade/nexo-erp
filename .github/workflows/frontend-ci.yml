name: frontend-ci

# Frontend gate: install from the committed lockfile, typecheck, lint, unit tests, production build
# and the critical Playwright suite (API mocked, no backend needed).
on:
  push:
    branches: [master]
    paths:
      - "nexo-main/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "nexo-main/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nexo-main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nexo-main/package-lock.json

      - name: Install (lockfile)
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Critical end-to-end suite
        run: npx playwright test

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: nexo-main/playwright-report
          retention-days: 7
