name: sonarcloud

# CI-based SonarCloud analysis WITH test coverage (backend: Microsoft Code Coverage XML;
# frontend: Vitest lcov). This is the project's analysis: it runs on every pull request and on every
# commit that reaches master, and it is what sends coverage to SonarCloud (docs/engineering/SONARCLOUD_COVERAGE.md).
#
# Without SONAR_TOKEN (a fork's pull request, for example) every step below is skipped and the job passes.
# Called by ci.yml and master.yml, which set when it runs and what may cancel it.
on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Is CI-based analysis configured?
        id: gate
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::SONAR_TOKEN not set — this run sends no analysis to SonarCloud. See docs/engineering/SONARCLOUD_COVERAGE.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 0   # full history: SonarCloud needs it to tell new code from old

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nexo-main/package-lock.json

      - name: Frontend tests with coverage (lcov)
        if: steps.gate.outputs.enabled == 'true'
        working-directory: nexo-main
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run test:coverage
          # Vitest writes paths relative to nexo-main (SF:src/...); the analysis runs from the
          # repository root, so without the prefix SonarCloud drops every frontend file.
          sed -i 's#^SF:src/#SF:nexo-main/src/#' coverage/lcov.info

      - name: Install SonarScanner for .NET
        if: steps.gate.outputs.enabled == 'true'
        run: dotnet tool install --global dotnet-sonarscanner --version 11.3.0

      # sonar.qualitygate.wait: on pull requests the job waits for the Quality Gate of the new code and fails
      # when it is red, so it gates the merge. On pushes to master the analysis is uploaded without waiting:
      # the master gate covers the whole history, and master-gate needs this job, so a red overall gate would
      # block every promotion for findings that predate the change.
      - name: Begin analysis
        if: steps.gate.outputs.enabled == 'true'
        run: >-
          dotnet sonarscanner begin
          /k:"eliasandraade_nexo-erp" /o:"eliasandraade"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="${SONAR_TOKEN}"
          /d:sonar.projectBaseDir="${GITHUB_WORKSPACE}"
          /d:sonar.cs.vscoveragexml.reportsPaths="nexo-backend/TestResults/**/*.xml"
          /d:sonar.javascript.lcov.reportPaths="nexo-main/coverage/lcov.info"
          /d:sonar.coverage.exclusions="**/Persistence/Migrations/**,nexo-main/e2e/**,**/*.test.ts,**/*.test.tsx,nexo-main/src/**/test/**,nexo-backend/tools/**,.railway/**,scripts/**"
          /d:sonar.cpd.exclusions="**/Persistence/Migrations/**"
          /d:sonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}
          /d:sonar.qualitygate.timeout=300

      - name: Build backend
        if: steps.gate.outputs.enabled == 'true'
        run: dotnet build nexo-backend/Nexo.sln

      - name: Backend tests with coverage (unit + integration)
        if: steps.gate.outputs.enabled == 'true'
        working-directory: nexo-backend
        run: |
          dotnet test tests/Nexo.UnitTests/Nexo.UnitTests.csproj --no-build \
            --settings coverage.runsettings --collect "Code Coverage" --results-directory TestResults/unit
          dotnet test tests/Nexo.IntegrationTests/Nexo.IntegrationTests.csproj --no-build \
            --settings coverage.runsettings --collect "Code Coverage" --results-directory TestResults/integration

      - name: End analysis (upload to SonarCloud)
        if: steps.gate.outputs.enabled == 'true'
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
